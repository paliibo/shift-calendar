<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Графік змін</title>
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Графік">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="app-icon-180.png">
<!-- заставка запуску: 393×852 @3x — iPhone 15 Pro (а також 14 Pro, 15, 16) -->
<link rel="apple-touch-startup-image" href="splash-light.png"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)">
<link rel="apple-touch-startup-image" href="splash-dark.png"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f4f2ee;
    --header-bg: rgba(244, 242, 238, 0.8);
    --card: #ffffff;
    --text: #1c1b19;
    --muted: #7a766e;
    --line: #e2ded6;
    --work: #2f5bea;
    --work-text: #ffffff;
    /* без перельоту: рух швидко стартує і мʼяко завмирає, нічого не підстрибує */
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111213;
      --header-bg: rgba(17, 18, 19, 0.78);
      --card: #1c1d20;
      --text: #ededeb;
      --muted: #8f8e8a;
      --line: #2b2c30;
      --work: #4f72f5;
      --work-text: #ffffff;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  :where(button, input):focus-visible { outline: 2px solid CanvasText; outline-offset: 2px; }

  .wrap {
    max-width: 480px; margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  .sentinel { position: absolute; top: 0; left: 0; width: 1px; height: 1px; pointer-events: none; }

  /* ── верхня панель ── */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(1.8) blur(20px);
    backdrop-filter: saturate(1.8) blur(20px);
    padding-top: calc(10px + env(safe-area-inset-top));
    border-bottom: 1px solid transparent;
    transition: border-color 0.4s ease;
  }
  .top.scrolled { border-bottom-color: var(--line); }
  .status { display: flex; align-items: center; gap: 12px; }
  .status-text { flex: 1; min-width: 0; }
  .eyebrow {
    margin: 0 0 3px; min-height: 17px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted);
  }
  .status h1 {
    margin: 0; font-size: 25px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center;
  }
  .dot {
    width: 12px; height: 12px; margin-right: 10px; border-radius: 4px; flex: none;
    border: 2px solid var(--muted);
    transition: background-color 0.5s ease, border-color 0.5s ease, opacity 0.4s ease,
                width 0.5s var(--spring), margin 0.5s var(--spring), border-width 0.5s var(--spring);
  }
  .dot.work { background: var(--work); border-color: var(--work); }
  .dot.none { width: 0; margin-right: 0; border-width: 0; opacity: 0; }
  .status .sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; min-height: 20px; }

  .icon-btn {
    flex: none; width: 46px; height: 46px; border-radius: 15px;
    border: 1px solid var(--line); background: var(--card);
    display: grid; place-items: center;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-top: 14px; padding-bottom: 8px;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); text-align: center;
  }
  .weekdays span:nth-child(n+6) { opacity: 0.6; }

  /* ── місяці ── */
  .earlier {
    display: block; margin: 12px auto 0; padding: 10px 16px;
    border: 0; border-radius: 999px; background: none; color: var(--muted); font-size: 14px;
    transition: opacity 0.3s ease;
  }
  .earlier:active { opacity: 0.45; }
  .month { margin-top: 26px; }
  .earlier + .month { margin-top: 8px; }
  .month-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .month-head h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .month-head h2 span { color: var(--muted); font-weight: 500; }
  .month-head small { color: var(--muted); font-size: 14px; min-height: 19px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    position: relative;
    aspect-ratio: 1; min-width: 0; padding: 0;
    border: 0; border-radius: 14px;
    background: transparent;
    font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums;
    display: grid; place-items: center;
    transition: background-color 0.5s ease, color 0.5s ease, opacity 0.5s ease, box-shadow 0.4s ease;
  }
  .day.work { background: var(--work); color: var(--work-text); font-weight: 700; }
  .day.past { opacity: 0.35; }
  .day.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .day::after {
    content: ""; position: absolute; bottom: 6px; left: 50%;
    width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%;
    background: currentColor; opacity: 0;
    transition: opacity 0.4s ease;
  }
  .day.ovr::after { opacity: 0.75; }

  /* ── кнопка «Сьогодні» ── */
  .fab {
    position: fixed; left: 50%; z-index: 6;
    bottom: calc(18px + env(safe-area-inset-bottom));
    padding: 13px 20px; border: 0; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: 16px; font-weight: 600;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    translate: -50% 0;
    opacity: 0; visibility: hidden;
    transition: opacity 0.35s ease, visibility 0s 0.5s;
  }
  .fab.show { opacity: 1; visibility: visible; transition-delay: 0s; }

  /* ── нижні шторки ── */
  dialog {
    position: fixed; inset: 0; width: 100%; height: 100%;
    max-width: none; max-height: none; margin: 0; padding: 0; border: 0;
    background: transparent; color: var(--text);
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  /* сторінка під шторкою не прокручується */
  dialog:modal { overscroll-behavior: contain; }
  dialog::backdrop { background: transparent; overflow: hidden; overscroll-behavior: contain; }
  .scrim {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45);
    transition: opacity 0.42s ease;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 480px; margin: 0 auto;
    padding: 10px max(18px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    border-radius: 28px 28px 0 0;
    background: var(--card);
    box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.16);
    outline: 0;
    transition: opacity 0.22s ease, translate 0.5s var(--spring);
    will-change: translate;
  }
  /* вихід: шторка лишається відкритою, поки не доїде (закриває її скрипт, коли переходи завершились) */
  dialog[data-closing] .scrim { opacity: 0; }
  @starting-style { dialog[open] .scrim { opacity: 0; } }
  dialog[data-dragging] .scrim, dialog[data-dragging] .sheet { transition: none; }

  .grabber { display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
  .sheet h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet .sub { margin: 4px 0 18px; color: var(--muted); font-size: 15px; }
  .btn {
    display: block; width: 100%; min-height: 54px; margin-top: 10px; padding: 8px 16px;
    border: 0; border-radius: 16px;
    background: var(--bg); font-size: 17px; font-weight: 600;
    transition: opacity 0.3s ease;
  }
  .btn:active { opacity: 0.7; transition-duration: 0.1s; }
  .btn:disabled { opacity: 0.45; }
  .btn.primary { background: var(--work); color: var(--work-text); }
  .btn.plain { background: none; color: var(--muted); font-weight: 500; }
  .btn small { display: block; font-size: 13px; font-weight: 400; opacity: 0.7; margin-top: 2px; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: 0; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 46px; height: 46px; border-radius: 14px; border: 0;
    background: var(--bg); font-size: 22px; font-weight: 500; line-height: 1;
    transition: opacity 0.3s ease;
  }
  .stepper button:active { opacity: 0.6; transition-duration: 0.1s; }
  .stepper output { width: 34px; text-align: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type="date"] {
    font: inherit; color: inherit; min-height: 46px; padding: 6px 12px;
    border: 0; border-radius: 14px; background: var(--bg);
  }

  /* ── рух: лише коли людина не просила його зменшити; кольори й прозорість перетікають завжди ── */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes intro { from { opacity: 0; translate: 0 14px; } }
    #months { animation: intro 0.7s var(--spring) backwards; }

    /* місяці проявляються разом із прокруткою: рух привʼязаний до пальця, тому нічого не вискакує */
    @supports ((animation-timeline: view()) and (animation-range: entry)) {
      @keyframes month-in { from { opacity: 0; translate: 0 26px; scale: 0.97; } }
      .month {
        animation: month-in auto linear backwards;
        animation-timeline: view();
        animation-range: entry 0% entry 55%;
      }
    }

    .day {
      transition: background-color 0.5s ease, color 0.5s ease, opacity 0.5s ease, box-shadow 0.4s ease,
                  scale 0.5s var(--spring);
    }
    .day.sel { scale: 1.1; z-index: 1; }
    /* невелика затримка, щоб день не смикався, коли палець просто починає прокрутку */
    .day:active { scale: 0.92; transition-duration: 0.5s, 0.5s, 0.5s, 0.4s, 0.2s; transition-delay: 0s, 0s, 0s, 0s, 90ms !important; }

    .dot { transition: background-color 0.5s ease, border-color 0.5s ease, opacity 0.4s ease,
                       width 0.5s var(--spring), margin 0.5s var(--spring), border-width 0.5s var(--spring),
                       scale 0.6s var(--spring); }
    .dot.work { scale: 1.15; }

    .icon-btn, .stepper button, .btn { transition: opacity 0.3s ease, scale 0.45s var(--spring); }
    .icon-btn:active, .stepper button:active { scale: 0.9; transition-duration: 0.1s, 0.12s; }
    .btn:active { scale: 0.975; transition-duration: 0.1s, 0.12s; }

    .fab { translate: -50% 26px; scale: 0.92;
           transition: opacity 0.35s ease, translate 0.55s var(--spring), scale 0.55s var(--spring), visibility 0s 0.55s; }
    .fab.show { translate: -50% 0; scale: 1; transition-delay: 0s; }
    .fab.show:active { scale: 0.95; transition-duration: 0.35s, 0.55s, 0.12s, 0s; }

    dialog[data-closing] .sheet { translate: 0 105%; transition-duration: 0.22s, 0.42s; }
    @starting-style { dialog[open] .sheet { translate: 0 105%; } }
  }
  @media (prefers-reduced-motion: reduce) {
    dialog[data-closing] .sheet { opacity: 0; }
    @starting-style { dialog[open] .sheet { opacity: 0; } }
  }
</style>
</head>
<body>
<i class="sentinel" id="sentinel"></i>

<header class="top" id="top">
  <div class="wrap">
    <div class="status">
      <div class="status-text">
        <p class="eyebrow" id="todayLabel"></p>
        <h1><i class="dot none" id="dot"></i><span id="statusTitle"></span></h1>
        <p class="sub" id="statusSub"></p>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="Налаштування">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
        </svg>
      </button>
    </div>
    <div class="weekdays" aria-hidden="true">
      <span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>нд</span>
    </div>
  </div>
</header>

<main class="wrap" id="months"></main>

<button class="fab" id="toToday">↑ Сьогодні</button>

<!-- шторка дня -->
<dialog id="daySheet" aria-labelledby="dayTitle">
  <div class="scrim" data-close></div>
  <div class="sheet" tabindex="-1" autofocus>
    <i class="grabber"></i>
    <h3 id="dayTitle"></h3>
    <p class="sub" id="daySub"></p>
    <button class="btn" id="dayToggle"></button>
    <button class="btn" id="dayAnchor">Зміна починається цього дня<small>перерахує весь графік від цієї дати</small></button>
    <button class="btn plain" data-close>Закрити</button>
  </div>
</dialog>

<!-- шторка налаштувань -->
<dialog id="settingsSheet" aria-labelledby="settingsTitle">
  <div class="scrim" data-close></div>
  <div class="sheet" tabindex="-1" autofocus>
    <i class="grabber"></i>
    <h3 id="settingsTitle">Графік</h3>
    <p class="sub">Скільки днів працюєш і скільки відпочиваєш</p>
    <div class="row">
      <span>Робочих підряд</span>
      <div class="stepper"><button data-step="work" data-d="-1" aria-label="Менше">−</button><output id="workOut"></output><button data-step="work" data-d="1" aria-label="Більше">+</button></div>
    </div>
    <div class="row">
      <span>Вихідних підряд</span>
      <div class="stepper"><button data-step="off" data-d="-1" aria-label="Менше">−</button><output id="offOut"></output><button data-step="off" data-d="1" aria-label="Більше">+</button></div>
    </div>
    <div class="row">
      <label for="anchorInput">Перший день зміни</label>
      <input type="date" id="anchorInput">
    </div>
    <button class="btn" id="resetOverrides" hidden></button>
    <button class="btn primary" data-close>Готово</button>
  </div>
</dialog>

<script>
(() => {
  const KEY = 'shift-calendar:v1';
  const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  const WD = ['пн','вт','ср','чт','пт','сб','нд'];
  const WD_FULL = ['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота','Неділя'];
  const MONTHS_AHEAD = 12;
  const SPRING = 'cubic-bezier(0.32, 0.72, 0, 1)';

  const $ = (id) => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // День як ціле число (кількість діб від епохи) — жодних сюрпризів із переведенням годинника.
  const dn = (y, m, d) => Math.floor(Date.UTC(y, m, d) / 864e5);
  const fromDn = (n) => {
    const t = new Date(n * 864e5);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate(), wd: (t.getUTCDay() + 6) % 7 };
  };
  const todayDn = () => { const t = new Date(); return dn(t.getFullYear(), t.getMonth(), t.getDate()); };
  const iso = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
  const plural = (n, one, few, many) => {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
    return many;
  };
  const fmt = (n) => { const d = fromDn(n); return `${WD[d.wd]}, ${d.d} ${MONTHS_GEN[d.m]}`; };

  // ── стан ──
  const state = { anchor: null, work: 2, off: 2, overrides: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) Object.assign(state, saved);
  } catch {}
  // старі ручні зміни більше не потрібні
  for (const k of Object.keys(state.overrides)) if (+k < todayDn() - 62) delete state.overrides[k];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const base = (n) => {
    if (state.anchor == null) return null;
    const c = state.work + state.off;
    return (((n - state.anchor) % c) + c) % c < state.work;
  };
  const isWork = (n) => {
    const o = state.overrides[n];
    return o != null ? o === 1 : base(n);
  };

  // ── текст, що змінюється: старий гасне, новий проявляється (без миттєвої підміни) ──
  const putText = (el, text) => { el.dataset.text = text; el.textContent = text; };
  function setText(el, text) {
    if (el.dataset.text === text) return;
    const first = el.dataset.text === undefined;
    el.dataset.text = text;
    if (first || !el.animate) { el.textContent = text; return; }
    if (el._out) return; // уже гасне — покаже найсвіжіший текст
    el._out = el.animate({ opacity: [1, 0] }, { duration: 140, easing: 'ease-in', fill: 'forwards' });
    el._out.finished.then(() => {
      el.textContent = el.dataset.text;
      el._out.cancel();
      el._out = null;
      el.animate(
        reduceMotion ? { opacity: [0, 1] } : { opacity: [0, 1], translate: ['0 5px', '0 0'] },
        { duration: 380, easing: SPRING },
      );
    }, () => { el._out = null; el.textContent = el.dataset.text; });
  }

  // ── календар: DOM будується один раз, далі лише перефарбовується (кольори перетікають) ──
  const $months = $('months'), $top = $('top'), $fab = $('toToday');
  let sections = [];   // { el, m, idx, count, days: [{ el, n }] }
  let back = 0;        // скільки минулих місяців показано
  let builtFor = 0;    // для якого «сьогодні» побудовано
  let sel = null, selShown = false;

  function makeMonth(idx) {
    const now = fromDn(builtFor);
    const total = now.m + idx;
    const y = now.y + Math.floor(total / 12);
    const m = ((total % 12) + 12) % 12;
    const first = dn(y, m, 1);
    const count = new Date(y, m + 1, 0).getDate();
    let cells = '<span></span>'.repeat(fromDn(first).wd);
    for (let d = 1; d <= count; d++) cells += `<button class="day" data-n="${first + d - 1}">${d}</button>`;
    const el = document.createElement('section');
    el.className = 'month';
    el.innerHTML = `<div class="month-head"><h2>${MONTHS[m]} <span>${y}</span></h2><small></small></div><div class="grid">${cells}</div>`;
    return {
      el, m, idx,
      count: el.querySelector('small'),
      days: [...el.querySelectorAll('.day')].map((b) => ({ el: b, n: +b.dataset.n })),
    };
  }

  function paintMonth(sec, origin) {
    let workCount = 0;
    for (const { el, n } of sec.days) {
      const w = isWork(n);
      if (w) workCount++;
      el.className = 'day' + (w ? ' work' : '') + (n < builtFor ? ' past' : '') + (n === builtFor ? ' today' : '')
        + (state.overrides[n] != null ? ' ovr' : '') + (n === sel && selShown ? ' sel' : '');
      el.setAttribute('aria-label', `${el.textContent} ${MONTHS_GEN[sec.m]}${w == null ? '' : w ? ', робочий' : ', вихідний'}`);
      // хвиля від обраного дня
      el.style.transitionDelay = origin == null || reduceMotion ? '' : `${90 + Math.min(Math.abs(n - origin) * 16, 480)}ms`;
    }
    setText(sec.count, state.anchor == null ? '' : `${workCount} ${plural(workCount, 'робочий', 'робочі', 'робочих')}`);
  }

  let waveTimer = 0;
  function paint(origin) {
    for (const s of sections) paintMonth(s, origin);
    renderStatus(builtFor);
    clearTimeout(waveTimer);
    if (origin != null) {
      waveTimer = setTimeout(() => {
        for (const s of sections) for (const c of s.days) c.el.style.transitionDelay = '';
      }, 1400);
    }
  }

  function build() {
    builtFor = todayDn();
    const t = fromDn(builtFor);
    setText($('todayLabel'), `${WD_FULL[t.wd]}, ${t.d} ${MONTHS_GEN[t.m]}`);
    $months.textContent = '';
    const earlier = document.createElement('button');
    earlier.className = 'earlier';
    earlier.id = 'earlier';
    earlier.textContent = '↑ Попередній місяць';
    $months.append(earlier);
    sections = [];
    for (let i = -back; i < MONTHS_AHEAD; i++) {
      const s = makeMonth(i);
      sections.push(s);
      $months.append(s.el);
    }
    paint();
    watchCurrentMonth();
  }

  // Новий місяць вставляється над поточними: прокрутка зсувається рівно на його висоту,
  // тож на екрані нічого не стрибає, а далі сторінка плавно підʼїжджає вгору й відкриває його.
  function addEarlier() {
    back++;
    const s = makeMonth(-back);
    const next = sections[0].el;
    const before = next.getBoundingClientRect().top;
    sections.unshift(s);
    paintMonth(s);
    $('earlier').after(s.el);
    window.scrollBy(0, next.getBoundingClientRect().top - before);
    scrollToY(0);
  }

  // ── статус ──
  function renderStatus(t) {
    let title, sub, work = false;
    if (state.anchor == null) {
      title = 'Налаштуй графік';
      sub = 'Тапни на перший день своєї зміни';
    } else if (isWork(t)) {
      work = true;
      let n = 1;
      while (n < 90 && isWork(t + n)) n++;
      title = 'Сьогодні робочий';
      sub = n === 1 ? 'Завтра вихідний' : n >= 90 ? '' : `Вихідні з ${fmt(t + n)}`;
    } else {
      let n = 1;
      while (n < 90 && !isWork(t + n)) n++;
      title = 'Сьогодні вихідний';
      sub = n === 1 ? 'Завтра на роботу' : n >= 90 ? '' : `На роботу: ${fmt(t + n)}`;
    }
    setText($('statusTitle'), title);
    setText($('statusSub'), sub);
    $('dot').className = 'dot' + (state.anchor == null ? ' none' : work ? ' work' : '');
  }

  // ── шторки ──
  // Поява — через CSS (@starting-style). Зникнення — атрибут data-closing і очікування,
  // поки переходи справді завершаться: жодних таймерів «на око», які обривають рух.
  const hasStartingStyle = 'CSSStartingStyleRule' in window;
  let dragEndedAt = 0;

  function settled(el) {
    const running = el.getAnimations({ subtree: true }).filter((a) => a instanceof CSSTransition);
    if (!running.length) return Promise.resolve();
    return Promise.race([
      Promise.allSettled(running.map((a) => a.finished)),
      new Promise((r) => setTimeout(r, 1500)),
    ]);
  }

  function openSheet(dlg) {
    if (dlg.open) return;
    dlg.showModal();
    if (!hasStartingStyle) { // старіший Safari: та сама поява, але скриптом
      const sheet = dlg.querySelector('.sheet');
      dlg.querySelector('.scrim').animate({ opacity: [0, 1] }, { duration: 420, easing: 'ease' });
      sheet.animate(reduceMotion ? { opacity: [0, 1] } : { translate: ['0 105%', '0 0'] },
        { duration: reduceMotion ? 220 : 500, easing: SPRING });
    }
  }

  async function closeSheet(dlg) {
    if (!dlg.open || dlg.hasAttribute('data-closing')) return;
    const sheet = dlg.querySelector('.sheet'), scrim = dlg.querySelector('.scrim');
    dlg.removeAttribute('data-dragging');
    dlg.setAttribute('data-closing', '');
    sheet.style.translate = '';
    scrim.style.opacity = '';
    if (dlg.id === 'daySheet') setSelShown(false);
    await settled(dlg);
    dlg.close();
    dlg.removeAttribute('data-closing');
  }

  function setupSheet(dlg) {
    const sheet = dlg.querySelector('.sheet'), scrim = dlg.querySelector('.scrim');
    let pid = null, startY = 0, dy = 0, lastY = 0, lastT = 0, vel = 0, dragged = false;

    // свайп униз: шторка їде за пальцем
    sheet.addEventListener('pointerdown', (e) => {
      if (e.target.closest('input') || dlg.hasAttribute('data-closing')) return;
      pid = e.pointerId; startY = lastY = e.clientY; lastT = e.timeStamp; dy = 0; vel = 0; dragged = false;
    });
    sheet.addEventListener('pointermove', (e) => {
      if (e.pointerId !== pid) return;
      dy = e.clientY - startY;
      if (!dragged) {
        if (dy < 8) return;
        dragged = true;
        startY += 8; dy -= 8; // без ривка на старті: рух починається з нуля
        dlg.setAttribute('data-dragging', '');
        try { sheet.setPointerCapture(pid); } catch {}
      }
      if (e.timeStamp > lastT) vel = (e.clientY - lastY) / (e.timeStamp - lastT);
      lastY = e.clientY; lastT = e.timeStamp;
      const y = Math.max(0, dy);
      sheet.style.translate = `0 ${y}px`;
      scrim.style.opacity = String(Math.max(0, 1 - y / sheet.offsetHeight));
    });
    const end = (e) => {
      if (e.pointerId !== pid) return;
      pid = null;
      if (!dragged) return;
      dragEndedAt = Date.now();
      // закриваємо, якщо стягнули на третину або змахнули вниз (але не від випадкового тремтіння пальця)
      if (dy > sheet.offsetHeight * 0.3 || (vel > 0.5 && dy > 24)) { closeSheet(dlg); return; }
      dlg.removeAttribute('data-dragging'); // повертається на місце тим самим плавним переходом
      sheet.style.translate = '';
      scrim.style.opacity = '';
    };
    sheet.addEventListener('pointerup', end);
    sheet.addEventListener('pointercancel', end);

    // після свайпу тап по кнопці під пальцем не повинен спрацювати
    dlg.addEventListener('click', (e) => {
      if (Date.now() - dragEndedAt < 350) { e.stopPropagation(); e.preventDefault(); }
    }, true);
    dlg.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(dlg); });
    // Esc та інші системні «закрий» теж ідуть через анімоване закриття
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); closeSheet(dlg); });
  }
  const $day = $('daySheet'), $settings = $('settingsSheet');
  setupSheet($day);
  setupSheet($settings);

  // ── шторка дня ──
  function setSelShown(on) {
    selShown = on;
    const b = sel != null && $months.querySelector(`.day[data-n="${sel}"]`);
    if (b) b.classList.toggle('sel', on);
  }

  function openDay(n) {
    if ($day.open) return;
    sel = n;
    const d = fromDn(n);
    $('dayTitle').textContent = `${WD_FULL[d.wd]}, ${d.d} ${MONTHS_GEN[d.m]}`;
    const configured = state.anchor != null;
    const hasOvr = state.overrides[n] != null;
    $('daySub').textContent = !configured ? 'Графік ще не налаштовано'
      : (isWork(n) ? 'Робочий день' : 'Вихідний') + (hasOvr ? ' · змінено вручну' : '');
    const toggle = $('dayToggle');
    toggle.hidden = !configured;
    toggle.textContent = hasOvr ? 'Повернути як за графіком' : isWork(n) ? 'Зробити вихідним' : 'Зробити робочим';
    $('dayAnchor').classList.toggle('primary', !configured);
    setSelShown(true);
    openSheet($day);
  }

  $months.addEventListener('click', (e) => {
    if (e.target.closest('#earlier')) { addEarlier(); return; }
    const b = e.target.closest('.day');
    if (b) openDay(+b.dataset.n);
  });

  $('dayToggle').addEventListener('click', () => {
    if (state.overrides[sel] != null) delete state.overrides[sel];
    else state.overrides[sel] = base(sel) ? 0 : 1;
    save(); closeSheet($day); paint();
  });

  $('dayAnchor').addEventListener('click', () => {
    state.anchor = sel;
    delete state.overrides[sel];
    save(); closeSheet($day); paint(sel);
  });

  // ── налаштування ──
  function syncSettings() {
    putText($('workOut'), String(state.work));
    putText($('offOut'), String(state.off));
    $('anchorInput').value = state.anchor == null ? '' : iso(state.anchor);
    const count = Object.keys(state.overrides).length;
    const reset = $('resetOverrides');
    reset.hidden = count === 0;
    reset.disabled = false;
    putText(reset, `Скинути ручні зміни (${count})`);
  }
  $('openSettings').addEventListener('click', () => { if (!$settings.open) { syncSettings(); openSheet($settings); } });
  $settings.addEventListener('click', (e) => {
    const s = e.target.closest('[data-step]');
    if (!s) return;
    const k = s.dataset.step;
    const next = Math.min(14, Math.max(1, state[k] + +s.dataset.d));
    if (next === state[k]) return;
    state[k] = next;
    save(); paint();
    setText($(k + 'Out'), String(next));
  });
  $('anchorInput').addEventListener('change', (e) => {
    const v = e.target.value;
    if (!v) return;
    const [y, m, d] = v.split('-').map(Number);
    state.anchor = dn(y, m - 1, d);
    save(); paint(state.anchor);
  });
  // кнопка не зникає під пальцем (шторка не смикається) — лише гасне до наступного відкриття
  $('resetOverrides').addEventListener('click', (e) => {
    state.overrides = {};
    save(); paint();
    e.currentTarget.disabled = true;
    setText(e.currentTarget, 'Ручні зміни скинуто');
  });

  // ── прокрутка: без обробників scroll — за видимістю стежить сам браузер ──
  const scrollToY = (top) => window.scrollTo({ top, behavior: reduceMotion ? 'auto' : 'smooth' });
  const currentMonth = () => sections.find((s) => s.idx === 0);
  const hasIO = 'IntersectionObserver' in window;

  // лінія під шапкою зʼявляється, щойно сторінку зрушили з місця
  if (hasIO) {
    new IntersectionObserver(([e]) => $top.classList.toggle('scrolled', !e.isIntersecting)).observe($('sentinel'));
  }
  // кнопка «Сьогодні» — коли поточний місяць зник з екрана
  let monthWatcher = null;
  function watchCurrentMonth() {
    if (monthWatcher) monthWatcher.disconnect();
    const cur = currentMonth();
    if (!hasIO || !cur) return;
    monthWatcher = new IntersectionObserver(
      ([e]) => $fab.classList.toggle('show', !e.isIntersecting),
      { rootMargin: `-${$top.offsetHeight + 40}px 0px -80px 0px` },
    );
    monthWatcher.observe(cur.el);
  }
  $fab.addEventListener('click', () => {
    const cur = currentMonth();
    scrollToY(back === 0 || !cur ? 0 : cur.el.getBoundingClientRect().top + window.scrollY - $top.offsetHeight - 10);
  });

  // застосунок міг провисіти у фоні до наступного дня
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && todayDn() !== builtFor) build();
  });

  // iOS: щоб працював :active і не було масштабування щипком
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  build();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
