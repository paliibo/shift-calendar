<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Графік змін</title>
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Графік">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --text: #1c1b19;
    --muted: #7a766e;
    --line: #e2ded6;
    --work: #2f5bea;
    --work-text: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111213;
      --card: #1c1d20;
      --text: #ededeb;
      --muted: #8f8e8a;
      --line: #2b2c30;
      --work: #4f72f5;
      --work-text: #ffffff;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  /* ── верхня панель ── */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding-top: calc(14px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
  }
  .status { display: flex; align-items: center; gap: 12px; }
  .status-text { flex: 1; min-width: 0; }
  .status h1 {
    margin: 0; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 10px;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 4px; flex: none;
    border: 2px solid var(--muted);
  }
  .dot.work { background: var(--work); border-color: var(--work); }
  .status p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .icon-btn {
    flex: none; width: 44px; height: 44px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card);
    display: grid; place-items: center;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    margin-top: 14px; padding-bottom: 8px;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); text-align: center;
  }
  .weekdays span:nth-child(n+6) { opacity: 0.6; }

  /* ── місяці ── */
  .earlier {
    display: block; margin: 14px auto 0; padding: 8px 14px;
    border: 0; background: none; color: var(--muted); font-size: 14px;
  }
  .month { margin-top: 26px; }
  .earlier + .month { margin-top: 10px; }
  .month-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .month-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .month-head h2 span { color: var(--muted); font-weight: 500; }
  .month-head small { color: var(--muted); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    position: relative;
    aspect-ratio: 1; min-width: 0; padding: 0;
    border: 0; border-radius: 13px;
    background: transparent;
    font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums;
    display: grid; place-items: center;
  }
  .day.work { background: var(--work); color: var(--work-text); font-weight: 700; }
  .day.past { opacity: 0.35; }
  .day.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
  .day.ovr::after {
    content: ""; position: absolute; bottom: 6px; left: 50%;
    width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%;
    background: currentColor; opacity: 0.75;
  }
  .day:active { transform: scale(0.94); }

  /* ── нижні шторки ── */
  dialog {
    border: 0; padding: 0;
    width: 100%; max-width: 480px;
    margin: auto auto 0;
    border-radius: 22px 22px 0 0;
    background: var(--card); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .sheet { padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet .sub { margin: 4px 0 18px; color: var(--muted); font-size: 15px; }
  .btn {
    display: block; width: 100%; min-height: 52px; margin-top: 10px; padding: 8px 16px;
    border: 0; border-radius: 15px;
    background: var(--bg); font-size: 17px; font-weight: 600;
  }
  .btn.primary { background: var(--work); color: var(--work-text); }
  .btn.plain { background: none; color: var(--muted); font-weight: 500; }
  .btn small { display: block; font-size: 13px; font-weight: 400; opacity: 0.7; margin-top: 2px; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: 0; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 13px; border: 0;
    background: var(--bg); font-size: 22px; font-weight: 500; line-height: 1;
  }
  .stepper output { width: 34px; text-align: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type="date"] {
    font: inherit; color: inherit; min-height: 44px; padding: 6px 12px;
    border: 0; border-radius: 13px; background: var(--bg);
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="status">
      <div class="status-text">
        <h1><i class="dot" id="dot"></i><span id="statusTitle"></span></h1>
        <p id="statusSub"></p>
      </div>
      <button class="icon-btn" id="openSettings" aria-label="Налаштування">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
        </svg>
      </button>
    </div>
    <div class="weekdays" aria-hidden="true">
      <span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>нд</span>
    </div>
  </div>
</header>

<main class="wrap" id="months"></main>

<!-- шторка дня -->
<dialog id="daySheet">
  <div class="sheet">
    <h3 id="dayTitle"></h3>
    <p class="sub" id="daySub"></p>
    <button class="btn" id="dayToggle"></button>
    <button class="btn" id="dayAnchor">Зміна починається цього дня<small>перерахує весь графік від цієї дати</small></button>
    <button class="btn plain" data-close>Закрити</button>
  </div>
</dialog>

<!-- шторка налаштувань -->
<dialog id="settingsSheet">
  <div class="sheet">
    <h3>Графік</h3>
    <p class="sub">Скільки днів працюєш і скільки відпочиваєш</p>
    <div class="row">
      <span>Робочих підряд</span>
      <div class="stepper"><button data-step="work" data-d="-1" aria-label="Менше">−</button><output id="workOut"></output><button data-step="work" data-d="1" aria-label="Більше">+</button></div>
    </div>
    <div class="row">
      <span>Вихідних підряд</span>
      <div class="stepper"><button data-step="off" data-d="-1" aria-label="Менше">−</button><output id="offOut"></output><button data-step="off" data-d="1" aria-label="Більше">+</button></div>
    </div>
    <div class="row">
      <label for="anchorInput">Перший день зміни</label>
      <input type="date" id="anchorInput">
    </div>
    <button class="btn" id="resetOverrides" hidden></button>
    <button class="btn primary" data-close>Готово</button>
  </div>
</dialog>

<script>
(() => {
  const KEY = 'shift-calendar:v1';
  const MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
  const WD = ['пн','вт','ср','чт','пт','сб','нд'];
  const WD_FULL = ['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота','Неділя'];
  const MONTHS_AHEAD = 12;

  const $ = (id) => document.getElementById(id);

  // День як ціле число (кількість діб від епохи) — жодних сюрпризів із переведенням годинника.
  const dn = (y, m, d) => Math.floor(Date.UTC(y, m, d) / 864e5);
  const fromDn = (n) => {
    const t = new Date(n * 864e5);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate(), wd: (t.getUTCDay() + 6) % 7 };
  };
  const todayDn = () => { const t = new Date(); return dn(t.getFullYear(), t.getMonth(), t.getDate()); };
  const iso = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
  const plural = (n, one, few, many) => {
    const a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
    return many;
  };
  const fmt = (n) => { const d = fromDn(n); return `${WD[d.wd]}, ${d.d} ${MONTHS_GEN[d.m]}`; };

  // ── стан ──
  const state = { anchor: null, work: 2, off: 2, overrides: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) Object.assign(state, saved);
  } catch {}
  // старі ручні зміни більше не потрібні
  for (const k of Object.keys(state.overrides)) if (+k < todayDn() - 62) delete state.overrides[k];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const base = (n) => {
    if (state.anchor == null) return null;
    const c = state.work + state.off;
    return (((n - state.anchor) % c) + c) % c < state.work;
  };
  const isWork = (n) => {
    const o = state.overrides[n];
    return o != null ? o === 1 : base(n);
  };

  // ── рендер ──
  let back = 0;        // скільки минулих місяців показано
  let renderedFor = 0; // для якого «сьогодні» намальовано

  function monthHtml(y, m, today) {
    const first = dn(y, m, 1);
    const days = new Date(y, m + 1, 0).getDate();
    const offset = fromDn(first).wd;
    let cells = '';
    let workCount = 0;
    for (let i = 0; i < offset; i++) cells += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const n = first + d - 1;
      const w = isWork(n);
      if (w) workCount++;
      const cls = ['day'];
      if (w) cls.push('work');
      if (n < today) cls.push('past');
      if (n === today) cls.push('today');
      if (state.overrides[n] != null) cls.push('ovr');
      const label = `${d} ${MONTHS_GEN[m]}${w == null ? '' : w ? ', робочий' : ', вихідний'}`;
      cells += `<button class="${cls.join(' ')}" data-n="${n}" aria-label="${label}">${d}</button>`;
    }
    const count = state.anchor == null ? '' :
      `<small>${workCount} ${plural(workCount, 'робочий', 'робочі', 'робочих')}</small>`;
    return `<section class="month">
      <div class="month-head"><h2>${MONTHS[m]} <span>${y}</span></h2>${count}</div>
      <div class="grid">${cells}</div>
    </section>`;
  }

  function renderStatus(t) {
    let title, sub, work = false;
    if (state.anchor == null) {
      title = 'Налаштуй графік';
      sub = 'Тапни на перший день своєї зміни';
    } else if (isWork(t)) {
      work = true;
      let n = 1;
      while (n < 90 && isWork(t + n)) n++;
      title = 'Сьогодні робочий';
      sub = n === 1 ? 'Завтра вихідний' : n >= 90 ? '' : `Вихідні з ${fmt(t + n)}`;
    } else {
      let n = 1;
      while (n < 90 && !isWork(t + n)) n++;
      title = 'Сьогодні вихідний';
      sub = n === 1 ? 'Завтра на роботу' : n >= 90 ? '' : `На роботу: ${fmt(t + n)}`;
    }
    $('statusTitle').textContent = title;
    $('statusSub').textContent = sub;
    $('dot').className = 'dot' + (work ? ' work' : '');
    $('dot').hidden = state.anchor == null;
  }

  function render() {
    const t = todayDn();
    renderedFor = t;
    const now = fromDn(t);
    let html = `<button class="earlier" id="earlier">↑ Попередній місяць</button>`;
    for (let i = -back; i < MONTHS_AHEAD; i++) {
      const idx = now.m + i;
      html += monthHtml(now.y + Math.floor(idx / 12), ((idx % 12) + 12) % 12, t);
    }
    $('months').innerHTML = html;
    renderStatus(t);
  }

  // ── шторка дня ──
  let sel = null;
  function openDay(n) {
    sel = n;
    const d = fromDn(n);
    $('dayTitle').textContent = `${WD_FULL[d.wd]}, ${d.d} ${MONTHS_GEN[d.m]}`;
    const configured = state.anchor != null;
    const hasOvr = state.overrides[n] != null;
    $('daySub').textContent = !configured ? 'Графік ще не налаштовано'
      : (isWork(n) ? 'Робочий день' : 'Вихідний') + (hasOvr ? ' · змінено вручну' : '');
    const toggle = $('dayToggle');
    toggle.hidden = !configured;
    toggle.textContent = hasOvr ? 'Повернути як за графіком' : isWork(n) ? 'Зробити вихідним' : 'Зробити робочим';
    $('dayAnchor').classList.toggle('primary', !configured);
    $('daySheet').showModal();
  }

  $('months').addEventListener('click', (e) => {
    if (e.target.closest('#earlier')) { back++; render(); window.scrollTo(0, 0); return; }
    const b = e.target.closest('.day');
    if (b) openDay(+b.dataset.n);
  });

  $('dayToggle').addEventListener('click', () => {
    if (state.overrides[sel] != null) delete state.overrides[sel];
    else state.overrides[sel] = base(sel) ? 0 : 1;
    save(); render(); $('daySheet').close();
  });

  $('dayAnchor').addEventListener('click', () => {
    state.anchor = sel;
    delete state.overrides[sel];
    save(); render(); $('daySheet').close();
  });

  // ── налаштування ──
  function syncSettings() {
    $('workOut').textContent = state.work;
    $('offOut').textContent = state.off;
    $('anchorInput').value = state.anchor == null ? '' : iso(state.anchor);
    const count = Object.keys(state.overrides).length;
    $('resetOverrides').hidden = count === 0;
    $('resetOverrides').textContent = `Скинути ручні зміни (${count})`;
  }
  $('openSettings').addEventListener('click', () => { syncSettings(); $('settingsSheet').showModal(); });
  $('settingsSheet').addEventListener('click', (e) => {
    const s = e.target.closest('[data-step]');
    if (!s) return;
    const k = s.dataset.step;
    state[k] = Math.min(14, Math.max(1, state[k] + +s.dataset.d));
    save(); render(); syncSettings();
  });
  $('anchorInput').addEventListener('change', (e) => {
    const v = e.target.value;
    if (!v) return;
    const [y, m, d] = v.split('-').map(Number);
    state.anchor = dn(y, m - 1, d);
    save(); render();
  });
  $('resetOverrides').addEventListener('click', () => {
    state.overrides = {};
    save(); render(); syncSettings();
  });

  // закриття шторок: кнопка або тап по затемненню
  for (const dlg of document.querySelectorAll('dialog')) {
    dlg.addEventListener('click', (e) => {
      if (e.target === dlg || e.target.closest('[data-close]')) dlg.close();
    });
  }

  // застосунок міг провисіти у фоні до наступного дня
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && todayDn() !== renderedFor) render();
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
