<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f88ff"/>
      <stop offset="0.5" stop-color="#2f5bea"/>
      <stop offset="1" stop-color="#1f3fc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecff"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a1c78" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- сітка 3×3 читається як календар; ритм «2 робочі / 2 вихідні» дає діагональ -->
  <g fill="#fff" fill-opacity="0.2">
    <rect x="636" y="220" width="168" height="168" rx="46"/>
    <rect x="220" y="428" width="168" height="168" rx="46"/>
    <rect x="220" y="636" width="168" height="168" rx="46"/>
    <rect x="428" y="636" width="168" height="168" rx="46"/>
  </g>
  <g fill="url(#tile)" filter="url(#lift)">
    <rect x="220" y="220" width="168" height="168" rx="46"/>
    <rect x="428" y="220" width="168" height="168" rx="46"/>
    <rect x="428" y="428" width="168" height="168" rx="46"/>
    <rect x="636" y="428" width="168" height="168" rx="46"/>
    <rect x="636" y="636" width="168" height="168" rx="46"/>
  </g>
</svg>
